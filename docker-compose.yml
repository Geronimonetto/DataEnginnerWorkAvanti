services:
  postgres:
    image: postgres:13-alpine
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_dw_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U airflow" ]
      interval: 5s
      retries: 5

  airflow:
    image: apache/airflow:2.8.0
    command: >
      bash -c "
        echo 'Instalando dependências do projeto...' &&
        pip install --quiet aiohttp pandas psycopg2-binary SQLAlchemy dbt-postgres dbt-core &&
        echo 'Dependências instaladas!' &&
        airflow db migrate &&
        airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@email.com --password admin123 || true;
        echo 'Airflow pronto — acesse http://localhost:8080 (admin / admin123)' &&
        echo 'Ative a DAG pipeline_medalhao_bcb e clique em Trigger para rodar o pipeline' &&
        exec airflow standalone
      "
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - PYTHONPATH=/opt/workavanti
      - POSTGRES_HOST=postgres
      - PROJECT_ROOT=/opt/workavanti
    volumes:
      - ./airflow_project/dags:/opt/airflow/dags
      - ./:/opt/workavanti
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_dw_data:
