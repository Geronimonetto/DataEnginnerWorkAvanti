version: '3.8'

services:
  postgres:
    image: postgres:13-alpine
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_dw_data:/var/lib/postgresql/data

  airflow-solo:
    image: apache/airflow:2.8.0
    command: >
      bash -c " airflow db migrate && 
        airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@email.com --password admin123 || true; 
        exec airflow standalone "
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - _PIP_ADDITIONAL_REQUIREMENTS=aiohttp pandas psycopg2-binary SQLAlchemy dbt-postgres dbt-core
      - PYTHONPATH=/opt/workavanti
      - POSTGRES_HOST=postgres
    volumes:
      - ./dags:/opt/airflow/dags
      - ../:/opt/workavanti
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_dw_data:
